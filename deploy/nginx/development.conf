map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
resolver 127.0.0.11 valid=5s ipv6=off;
upstream api_upstream { zone api 64k; server api:8000 resolve; }
upstream web_upstream { zone web 64k; server web:5173 resolve; }
server {
    listen 80;
    server_name _;
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /health/ { proxy_pass http://api_upstream; }
    location /sandbox/ {
        access_log off;
        proxy_pass http://api_upstream;
        proxy_set_header Host $http_host;
    }
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:; img-src 'self' data:; frame-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
