[project]
name = "atoms-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
kms = [
    "alibabacloud-credentials>=0.3.6,<2",
    "alibabacloud-kms20160120>=2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  "atoms/skills/pptx",
  "atoms/skills/threejs-game-skills",
  "atoms/skills/web-artifacts-builder",
  "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
